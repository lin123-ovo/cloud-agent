name: cloudagent-local
services:
  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  mysql:
    image: mysql:8.0.41
    environment:
      MYSQL_ROOT_PASSWORD: ${CLOUDAGENT_MYSQL_ROOT_PASSWORD:?missing password}
      MYSQL_DATABASE: cloud_platform
      MYSQL_USER: cloudagent
      MYSQL_PASSWORD: ${CLOUDAGENT_MYSQL_PASSWORD:?missing password}
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./agent/database/init_mock_data.sql:/docker-entrypoint-initdb.d/01-mock-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  neo4j:
    image: neo4j:5.18.0
    environment:
      NEO4J_AUTH: neo4j/${CLOUDAGENT_NEO4J_PASSWORD:?missing password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:17687:7687"]
    volumes: ["neo4j_data:/data", "neo4j_plugins:/plugins"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["etcd_data:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${CLOUDAGENT_MINIO_USER:?missing user}
      MINIO_ROOT_PASSWORD: ${CLOUDAGENT_MINIO_PASSWORD:?missing password}
    command: minio server /minio_data
    volumes: ["minio_data:/minio_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${CLOUDAGENT_MINIO_USER:?missing user}
      MINIO_SECRET_ACCESS_KEY: ${CLOUDAGENT_MINIO_PASSWORD:?missing password}
    ports: ["127.0.0.1:19531:19530", "127.0.0.1:19091:9091"]
    volumes: ["milvus_data:/var/lib/milvus"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
volumes:
  redis_data:
  mysql_data:
  neo4j_data:
  neo4j_plugins:
  etcd_data:
  minio_data:
  milvus_data:
